spring.application.name=apotek
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5580/apotek}
spring.datasource.username=${DATABASE_USER:apotek}
spring.datasource.password=${DATABASE_PASSWORD:apotek}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Uploaded prescriptions live outside the web root and are only served through the API.
apotek.uploads-dir=${UPLOADS_DIR:./uploads}
# Batches closer than this to expiry are not sold online.
apotek.min-shelf-life-days=30
# Unpaid orders are cancelled and their stock returned after this long.
apotek.payment-window=24h
apotek.shipping-fee=15000
apotek.free-shipping-from=150000
